<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </radialGradient>

    <!-- Wood / Vintage Chassis Gradient -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="30%" stop-color="#78350f" />
      <stop offset="70%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#271003" />
    </linearGradient>

    <!-- Metallic Bezel / Trim -->
    <linearGradient id="metalBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glowing Amber Dial Backlight -->
    <linearGradient id="dialBacklight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Speaker Grille Inner -->
    <linearGradient id="speakerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Canvas Base / Squircle Badge -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="6" />

  <!-- Radio Antenna -->
  <line x1="140" y1="140" x2="380" y2="46" stroke="#94a3b8" stroke-width="12" stroke-linecap="round" filter="url(#shadow)" />
  <circle cx="384" cy="44" r="10" fill="#f59e0b" />

  <!-- Vintage Radio Outer Chassis -->
  <g filter="url(#shadow)">
    <!-- Main Box -->
    <rect x="64" y="130" width="384" height="290" rx="36" fill="url(#chassisGrad)" stroke="url(#metalBezel)" stroke-width="8" />

    <!-- Chrome Top Handle -->
    <path d="M160 130 C160 90, 352 90, 352 130" fill="none" stroke="#d6d3d1" stroke-width="14" stroke-linecap="round" />
    <circle cx="160" cy="130" r="10" fill="#78716c" />
    <circle cx="352" cy="130" r="10" fill="#78716c" />

    <!-- Speaker Slits / Acoustic Left Grille (Circle) -->
    <circle cx="178" cy="275" r="78" fill="url(#speakerGrad)" stroke="#78350f" stroke-width="5" />
    <!-- Speaker Concentric Rings & Mesh -->
    <circle cx="178" cy="275" r="58" fill="none" stroke="#44403c" stroke-width="3" stroke-dasharray="8 6" />
    <circle cx="178" cy="275" r="40" fill="none" stroke="#57534e" stroke-width="3" />
    <circle cx="178" cy="275" r="22" fill="#292524" stroke="#78716c" stroke-width="3" />
    <circle cx="178" cy="275" r="8" fill="#f59e0b" opacity="0.9" />

    <!-- Right Side: Frequency Dial Window & Knobs -->
    <!-- Dial Glass Window -->
    <rect x="276" y="170" width="144" height="74" rx="10" fill="url(#dialBacklight)" stroke="#292524" stroke-width="4" filter="url(#amberGlow)" />
    
    <!-- Dial Scale Lines -->
    <line x1="288" y1="184" x2="288" y2="200" stroke="#451a03" stroke-width="3" stroke-linecap="round" />
    <line x1="304" y1="184" x2="304" y2="194" stroke="#451a03" stroke-width="2" stroke-linecap="round" />
    <line x1="320" y1="184" x2="320" y2="200" stroke="#451a03" stroke-width="3" stroke-linecap="round" />
    <line x1="336" y1="184" x2="336" y2="194" stroke="#451a03" stroke-width="2" stroke-linecap="round" />
    <line x1="352" y1="184" x2="352" y2="200" stroke="#451a03" stroke-width="3" stroke-linecap="round" />
    <line x1="368" y1="184" x2="368" y2="194" stroke="#451a03" stroke-width="2" stroke-linecap="round" />
    <line x1="384" y1="184" x2="384" y2="200" stroke="#451a03" stroke-width="3" stroke-linecap="round" />
    <line x1="400" y1="184" x2="400" y2="200" stroke="#451a03" stroke-width="3" stroke-linecap="round" />

    <!-- MW / SW Vintage Band Label Indicator -->
    <text x="290" y="230" font-family="monospace" font-size="14" font-weight="bold" fill="#451a03" letter-spacing="2">VIVIDH</text>

    <!-- Tuning Red Frequency Indicator Line -->
    <line x1="352" y1="172" x2="352" y2="242" stroke="#dc2626" stroke-width="4" stroke-linecap="round" />
    <circle cx="352" cy="180" r="3" fill="#ffffff" />

    <!-- Volume & Tuning Brass Knobs -->
    <!-- Large Tuning Knob -->
    <g>
      <circle cx="316" cy="320" r="28" fill="#1c1917" stroke="url(#metalBezel)" stroke-width="4" />
      <circle cx="316" cy="320" r="20" fill="#292524" />
      <line x1="316" y1="298" x2="316" y2="310" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Volume Knob -->
    <g>
      <circle cx="384" cy="320" r="28" fill="#1c1917" stroke="url(#metalBezel)" stroke-width="4" />
      <circle cx="384" cy="320" r="20" fill="#292524" />
      <line x1="384" y1="298" x2="384" y2="310" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Bottom Station Badge -->
    <rect x="292" y="374" width="116" height="20" rx="4" fill="#0c0a09" stroke="#78350f" stroke-width="2" />
    <text x="350" y="388" text-anchor="middle" font-family="serif" font-size="10" font-weight="bold" fill="#f59e0b" letter-spacing="1">1990s RADIO</text>

    <!-- Vintage Power LED Indicator -->
    <circle cx="106" cy="168" r="6" fill="#ef4444" filter="url(#shadow)" />
    <circle cx="106" cy="168" r="3" fill="#fecaca" />
  </g>
</svg>
